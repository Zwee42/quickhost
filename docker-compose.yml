services:
  # NGINX reverse proxy and main web server
  quickhost-nginx:
    image: nginx:alpine
    container_name: quickhost-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/http.d/default.conf:ro
      - nginx-conf:/etc/nginx/conf.d
      - ssl-certs:/etc/ssl/certs
      - ssl-keys:/etc/ssl/private
      - certbot-data:/var/www/certbot
    depends_on:
      - quickhost-app
    networks:
      - quickhost-network
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.quickhost.description=NGINX reverse proxy for QuickHost"

  # QuickHost main application (Next.js frontend + API backend)
  quickhost-app:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile
    container_name: quickhost-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - ROOT_DOMAIN=${ROOT_DOMAIN:-localhost}
      - BASE_PORT=${BASE_PORT:-5000}
      - ENABLE_SSL=${ENABLE_SSL:-true}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-admin@example.com}
      - DATA_PATH=${DATA_PATH:-/data/quickhost.db}
      - PROJECTS_PATH=${PROJECTS_PATH:-/data/projects}
      - CERT_PATH=${CERT_PATH:-/data/certificates}
      - NGINX_CONF_DIR=${NGINX_CONF_DIR:-/etc/nginx/conf.d}
    expose:
      - "3000"
    volumes:
      - app-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - nginx-conf:/etc/nginx/conf.d
      - ssl-certs:/etc/ssl/certs
      - ssl-keys:/etc/ssl/private
    networks:
      - quickhost-network
    depends_on:
      - nginx-init
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.quickhost.description=QuickHost main application"

  # NGINX configuration directory init
  nginx-init:
    image: busybox:latest
    volumes:
      - nginx-conf:/etc/nginx/conf.d
      - ssl-certs:/etc/ssl/certs
      - ssl-keys:/etc/ssl/private
    command: sh -c "mkdir -p /etc/nginx/conf.d /etc/ssl/certs /etc/ssl/private && chmod 755 /etc/nginx/conf.d"

  # Certbot for SSL certificate management
  certbot:
    image: certbot/certbot:latest
    container_name: quickhost-certbot
    restart: unless-stopped
    volumes:
      - ssl-certs:/etc/letsencrypt/live
      - ssl-keys:/etc/letsencrypt/keys
      - certbot-data:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $!; done"
    networks:
      - quickhost-network
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-admin@example.com}
    depends_on:
      - quickhost-nginx
    labels:
      - "com.quickhost.description=Let's Encrypt certificate management"

networks:
  quickhost-network:
    name: quickhost-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  app-data:
    name: quickhost-app-data
    driver: local
  nginx-conf:
    name: quickhost-nginx-conf
    driver: local
  ssl-certs:
    name: quickhost-ssl-certs
    driver: local
  ssl-keys:
    name: quickhost-ssl-keys
    driver: local
  certbot-data:
    name: quickhost-certbot-data
    driver: local

