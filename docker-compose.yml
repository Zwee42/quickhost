
services:
  # Nginx reverse proxy and web server
  nginx:
    image: nginx:alpine
    container_name: %repo%-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/http.d/default.conf:ro
    depends_on:
      - nextjs-backend
      - nextjs-frontend
    networks:
      - quickhost-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Backend Next.js application
  nextjs-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: %repo%-backend
    restart: always
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    networks:
      - quickhost-network
    expose:
      - "3000"

  # Frontend Next.js application
  nextjs-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: %repo%-frontend
    restart: always
    environment:
      - NODE_ENV=production
    networks:
      - quickhost-network
    expose:
      - "3000"

networks:
  quickhost-network:
    driver: bridge

